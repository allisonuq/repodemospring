
<div class="modal">
  <div class="modal-content">

    <h2>Editar reserva</h2>

    <form (ngSubmit)="guardarCambios()">

      <label>Nombre del cliente:</label>
      <input
        type="text"
        name="cliente"
        [(ngModel)]="datosReserva.cliente"
        required
      >

      <label>Cancha:</label>
      <select
        name="cancha"
        [(ngModel)]="datosReserva.cancha"
        required
      >
        <option value="Fútbol 7">Fútbol 7</option>
        <option value="Fútbol 11">Fútbol 11</option>
        <option value="Vóley">Vóley</option>
        <option value="Básquet">Básquet</option>
      </select>

      <label>Fecha:</label>
      <input
        type="date"
        name="fecha"
        [(ngModel)]="datosReserva.fecha"
        required
      >

      <label>Hora:</label>
      <input
        type="time"
        name="hora"
        [(ngModel)]="datosReserva.hora"
        required
      >

      <label>Estado:</label>
      <select
        name="estado"
        [(ngModel)]="datosReserva.estado"
      >
        <option value="Confirmada">Confirmada</option>
        <option value="Pendiente">Pendiente</option>
        <option value="Cancelada">Cancelada</option>
      </select>

      <div class="botones">
        <button type="button" class="cancelar" (click)="cerrar.emit()">
          Cancelar
        </button>

        <button type="submit" class="guardar">
          Guardar cambios
        </button>
      </div>

    </form>

  </div>
</div>
